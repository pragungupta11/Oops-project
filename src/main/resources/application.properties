spring.application.name=iitsm

# File database, only reachable from inside the app (no open network port).
spring.datasource.url=jdbc:h2:file:./data/iitsm
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.security.admin.username=${APP_ADMIN_USERNAME:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:ChangeMe123!}

# Product name and tagline shown in the navbar, login page and page titles (one place to rename).
app.brand=IncidentIQ
app.tagline=Smarter incident resolution

# Resolved incidents the employee neither confirms nor reopens are closed automatically after this time.
app.auto-close-after=3d

# Self sign-up: only e-mail addresses of this domain may create employee accounts.
app.signup-email-domain=company.com
# Guardrail: at most this many incidents per employee per hour.
app.max-reports-per-hour=5
