<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My queue')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mb-5" style="max-width: 980px;">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="d-flex justify-content-between align-items-end mb-3">
        <div>
            <h2 class="mb-0"><i class="bi bi-inboxes"></i> My queue</h2>
            <div class="text-body-secondary small">Most urgent first: sorted by resolution deadline.</div>
        </div>
    </div>

    <div class="page text-center text-body-secondary py-5" th:if="${#lists.isEmpty(rows)}">
        <i class="bi bi-cup-hot fs-1 d-block mb-2"></i>
        Nothing is assigned to you right now.
    </div>

    <div class="d-grid gap-3">
        <a th:each="i : ${rows}" th:href="@{/technician/incidents/{id}(id=${i.id()})}"
           class="card queue-card text-decoration-none text-body"
           th:classappend="${i.sla() == 'VIOLATED'} ? 'sla-violated' : (${i.sla() == 'AT_RISK'} ? 'sla-risk' : (${i.open()} ? 'sla-ok' : ''))">
            <div class="card-body d-flex flex-wrap align-items-center gap-3">
                <div class="flex-grow-1" style="min-width: 240px;">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <strong th:text="${i.id()}">INC1001</strong>
                        <span class="badge" th:classappend="${i.priorityClass()}" th:text="${i.priority()}">P1</span>
                        <span class="badge" th:classappend="${i.statusClass()}" th:text="${@labels.status(i.status())}">Assigned</span>
                        <span class="badge text-bg-secondary" th:if="${i.linked()}"
                              th:text="'linked to ' + ${i.parentId()}">linked</span>
                        <span class="badge text-bg-danger" th:if="${!#strings.isEmpty(i.escalation())}"
                              th:text="'Escalated: ' + ${@labels.escalation(i.escalation())}">Escalated</span>
                    </div>
                    <div class="text-truncate" style="max-width: 560px;" th:text="${i.description()}">Payment app down</div>
                    <div class="small text-body-secondary" th:text="${i.category()} + ' · ' + ${i.serviceName()} + ' · reported ' + ${i.created()}">
                        Network · VPN</div>
                </div>
                <div class="text-end" th:if="${i.open() and !i.linked() and !#strings.isEmpty(i.resolutionDueIso())}">
                    <div class="small text-body-secondary">Resolve within</div>
                    <div class="countdown fs-5" th:attr="data-due=${i.resolutionDueIso()}">--:--</div>
                </div>
                <div class="text-end text-body-secondary small" th:unless="${i.open()}">
                    <i class="bi bi-check2-circle"></i> done
                </div>
            </div>
        </a>
    </div>
</div>
<script>
    // Live SLA countdown on each card: green, amber under 30% left, red when overdue.
    (function () {
        const items = document.querySelectorAll('.countdown[data-due]');
        function pad(n) { return String(n).padStart(2, '0'); }
        function tick() {
            const now = Date.now();
            items.forEach(el => {
                const due = new Date(el.dataset.due).getTime();
                if (isNaN(due)) return;
                let ms = due - now;
                const overdue = ms < 0;
                ms = Math.abs(ms);
                const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
                el.textContent = (overdue ? 'overdue ' : '') + (h > 0 ? h + 'h ' : '') + pad(m) + 'm ' + pad(s) + 's';
                el.classList.toggle('text-danger', overdue);
                el.classList.toggle('text-warning', !overdue && ms < 10 * 60000);
                el.classList.toggle('text-success', !overdue && ms >= 10 * 60000);
            });
        }
        tick();
        setInterval(tick, 1000);
    })();
</script>
</body>
</html>
