<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mb-5">
    <div class="page">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0"><i class="bi bi-list-ul"></i> My incidents</h2>
            <a class="btn btn-primary" th:href="@{/employee/report}"><i class="bi bi-plus-circle"></i> Report incident</a>
        </div>

        <div class="text-center text-body-secondary py-5" th:if="${#lists.isEmpty(rows)}">
            <i class="bi bi-emoji-smile fs-1 d-block mb-2"></i>
            You have not reported any incidents yet.
        </div>

        <div class="table-responsive" th:unless="${#lists.isEmpty(rows)}">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr><th>ID</th><th>Problem</th><th>Urgency</th><th>Status</th><th>Technician</th><th>Reported</th></tr>
                </thead>
                <tbody>
                <tr th:each="i : ${rows}">
                    <td><a th:href="@{/employee/incidents/{id}(id=${i.id()})}" th:text="${i.id()}">INC1001</a></td>
                    <td>
                        <div class="text-truncate" style="max-width: 280px;" th:text="${i.description()}">Payment app down</div>
                        <div class="small text-body-secondary" th:text="${i.category()} + ' · ' + ${i.serviceName()}">Network · VPN</div>
                    </td>
                    <td><span class="badge" th:classappend="${i.priorityClass()}" th:text="${i.urgencyLabel()}">High</span></td>
                    <td><span class="badge" th:classappend="${i.statusClass()}">
                        <i class="bi" th:classappend="'bi-' + ${@labels.statusIcon(i.status())}"></i>
                        <span th:text="${@labels.status(i.status())}">Assigned</span></span></td>
                    <td th:text="${i.technicianName()}">Ravi Kumar</td>
                    <td class="text-nowrap" th:text="${i.created()}">19 Nov 2026, 10:00</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
