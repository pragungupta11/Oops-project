<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">My incidents</h2>
        <a class="btn btn-primary" th:href="@{/employee/report}">Report incident</a>
    </div>

    <div class="alert alert-secondary" th:if="${#lists.isEmpty(rows)}">
        You have not reported any incidents yet.
    </div>

    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(rows)}">
        <thead>
        <tr>
            <th>ID</th><th>Category</th><th>Service</th><th>Urgency</th>
            <th>Status</th><th>Technician</th><th>Reported</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="i : ${rows}">
            <td><a th:href="@{/employee/incidents/{id}(id=${i.id()})}" th:text="${i.id()}">INC1001</a></td>
            <td th:text="${i.category()}">Network</td>
            <td th:text="${i.serviceName()}">VPN</td>
            <td><span class="badge" th:classappend="${i.priorityClass()}" th:text="${i.urgencyLabel()}">High</span></td>
            <td><span class="badge" th:classappend="${i.statusClass()}" th:text="${i.status()}">ASSIGNED</span></td>
            <td th:text="${i.technicianName()}">Ravi Kumar</td>
            <td th:text="${i.created()}">19 Nov 2026, 10:00</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
