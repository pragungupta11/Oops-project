<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - I-ITSM'">I-ITSM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark px-3 mb-4">
    <span class="navbar-brand">I-ITSM</span>
    <ul class="navbar-nav me-auto">
        <li class="nav-item" th:if="${isEmployee}"><a class="nav-link" th:href="@{/employee/incidents}">My incidents</a></li>
        <li class="nav-item" th:if="${isEmployee}"><a class="nav-link" th:href="@{/employee/report}">Report incident</a></li>
        <li class="nav-item" th:if="${isTechnician}"><a class="nav-link" th:href="@{/technician/incidents}">Assigned to me</a></li>
        <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
        <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" th:href="@{/admin/incidents}">All incidents</a></li>
        <li class="nav-item" th:if="${isAdmin}"><a class="nav-link" th:href="@{/admin/outbox}">Email outbox</a></li>
    </ul>
    <a class="btn btn-outline-light btn-sm me-3 position-relative" th:href="@{/notifications}" title="Notifications">
        &#128276;
        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              th:if="${unreadNotifications != null and unreadNotifications > 0}"
              th:text="${unreadNotifications}">3</span>
    </a>
    <span class="navbar-text me-3" th:text="${currentUser}">user</span>
    <form th:action="@{/logout}" method="post" class="d-inline">
        <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
    </form>
</nav>
</body>
</html>
