<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="timeline(entries)">
    <h5 class="mt-4 mb-3"><i class="bi bi-clock-history"></i> History</h5>
    <p class="text-body-secondary" th:if="${#lists.isEmpty(entries)}">No history yet.</p>
    <ul class="timeline" th:unless="${#lists.isEmpty(entries)}">
        <li th:each="e : ${entries}">
            <span class="dot" th:classappend="'bg-' + ${e.colour()}"><i class="bi" th:classappend="'bi-' + ${e.icon()}"></i></span>
            <div class="d-flex justify-content-between">
                <strong th:text="${e.title()}">Reported</strong>
                <small class="text-body-secondary" th:text="${e.time()}">20 Nov, 10:00</small>
            </div>
            <div class="small text-body-secondary" th:if="${!#strings.isEmpty(e.detail())}" th:text="${e.detail()}">by employee1</div>
        </li>
    </ul>
</div>
</body>
</html>
