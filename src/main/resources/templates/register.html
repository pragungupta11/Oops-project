<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center;
                  background: radial-gradient(circle at 20% 20%, rgba(79,70,229,.25), transparent 45%),
                              radial-gradient(circle at 80% 80%, rgba(14,165,233,.25), transparent 45%),
                              var(--bs-tertiary-bg); }
    .login-card { width: 100%; max-width: 460px; border: 0; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
    .login-logo { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
                  background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-size: 1.5rem; }
</style>
<div class="login-wrap px-3 py-4">
    <div class="card login-card">
        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-3">
                <div class="login-logo"><i class="bi bi-person-plus"></i></div>
                <div>
                    <h1 class="h4 mb-0">Create your account</h1>
                    <div class="text-body-secondary small">
                        Employees of the company can sign up to report IT problems.
                    </div>
                </div>
            </div>

            <div class="alert alert-danger py-2" th:if="${error}" role="alert">
                <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">Error</span>
            </div>

            <form th:action="@{/register}" method="post" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="fullName" name="fullName" th:classappend="${missing != null and missing.contains('fullName')} ? 'is-invalid' : ''" placeholder="Full name"
                           th:value="${fullName}" autocomplete="name" required maxlength="100">
                    <label for="fullName">Full name</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="email" name="email" th:classappend="${missing != null and missing.contains('email')} ? 'is-invalid' : ''" placeholder="E-mail"
                           th:value="${email}" autocomplete="email" required>
                    <label for="email" th:text="'Company e-mail (@' + ${emailDomain} + ')'">Company e-mail</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username" th:classappend="${missing != null and missing.contains('username')} ? 'is-invalid' : ''" placeholder="Username"
                           th:value="${username}" autocomplete="username" required minlength="3" maxlength="30"
                           pattern="[a-z0-9._]{3,30}">
                    <label for="username">Username (lowercase, 3-30 characters)</label>
                </div>
                <div class="form-floating mb-2">
                    <input type="password" class="form-control" id="password" name="password" th:classappend="${missing != null and missing.contains('password')} ? 'is-invalid' : ''" placeholder="Password"
                           autocomplete="new-password" required minlength="8">
                    <label for="password">Password</label>
                </div>
                <div class="form-text mb-3">At least 8 characters, with a letter and a digit.</div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="confirm" name="confirm" th:classappend="${missing != null and missing.contains('confirm')} ? 'is-invalid' : ''" placeholder="Confirm password"
                           autocomplete="new-password" required minlength="8">
                    <label for="confirm">Confirm password</label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-person-check"></i> Create account</button>
            </form>
            <div class="text-center mt-3 small">
                Already have an account? <a th:href="@{/login}">Sign in</a>
            </div>
            <div class="text-body-secondary small mt-3">
                <i class="bi bi-shield-lock"></i> Technician and admin accounts are created by an administrator.
            </div>
        </div>
    </div>
</div>
</body>
</html>
