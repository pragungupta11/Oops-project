<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mb-5" style="max-width: 860px;">
  <div class="page">
    <h2 class="mb-3"><i class="bi bi-bell"></i> Notifications</h2>
    <div class="text-center text-body-secondary py-4" th:if="${#lists.isEmpty(items)}">
        <i class="bi bi-inbox fs-1 d-block mb-2"></i>Nothing yet.
    </div>
    <div class="list-group">
        <div class="list-group-item" th:each="n : ${items}" th:classappend="${n.isNew()} ? 'list-group-item-warning' : ''">
            <div class="d-flex justify-content-between">
                <strong th:text="${n.subject()}">INC1002 resolved</strong>
                <small class="text-muted">
                    <span class="badge bg-danger me-1" th:if="${n.isNew()}">new</span>
                    <span th:text="${n.time()}">20 Nov 2026, 10:00</span>
                </small>
            </div>
            <div th:text="${n.body()}">Your incident has been resolved.</div>
        </div>
    </div>
  </div>
</div>
</body>
</html>
