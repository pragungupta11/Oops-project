<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Email outbox')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h2 class="mb-1">Email outbox</h2>
    <p class="text-muted">Simulated e-mails: built exactly like real ones but not sent to a mail server.</p>
    <p class="text-muted" th:if="${#lists.isEmpty(emails)}">No e-mails yet.</p>
    <table class="table table-sm align-middle" th:unless="${#lists.isEmpty(emails)}">
        <thead><tr><th>Sent</th><th>To</th><th>Subject</th><th>Message</th></tr></thead>
        <tbody>
        <tr th:each="e : ${emails}">
            <td class="text-nowrap" th:text="${e.time()}">20 Nov 2026, 10:00</td>
            <td th:text="${e.to()}">employee1@company.com</td>
            <td th:text="${e.subject()}">[I-ITSM] INC1002 received</td>
            <td th:text="${e.body()}">We received your report.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
