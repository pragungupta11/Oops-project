<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container-fluid px-4 mb-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
        <div>
            <h2 class="mb-0"><i class="bi bi-journal-text"></i> Audit log</h2>
            <div class="small text-body-secondary">Every important action: who, what, when. Records are never edited. 100 per page.</div>
        </div>
        <form class="d-flex gap-2" method="get" th:action="@{/admin/audit}">
            <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Search: INC1001, tech2, ESCALATED..."
                   aria-label="Search the audit log" style="min-width: 280px;">
            <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i></button>
        </form>
    </div>
    <div class="page p-2 table-responsive">
        <table class="table table-sm table-hover align-middle mb-0">
            <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th><th>State change</th><th>Details</th></tr></thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(rows)}"><td colspan="6" class="text-body-secondary">No matching entries.</td></tr>
            <tr th:each="r : ${rows}">
                <td class="text-nowrap small" th:text="${r.time()}">20 Nov 2026, 10:00:00</td>
                <td th:text="${r.actor()}">admin</td>
                <td><code th:text="${r.action()}">INCIDENT_CREATED</code></td>
                <td class="text-nowrap" th:text="${r.entity()}">INCIDENT INC1001</td>
                <td class="text-nowrap small" th:text="${r.change()}">ASSIGNED → ACKNOWLEDGED</td>
                <td class="small" th:text="${r.details()}">details</td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav class="d-flex justify-content-between mt-3" aria-label="Audit log pages">
        <a class="btn btn-outline-secondary btn-sm" th:if="${page > 0}"
           th:href="@{/admin/audit(q=${q}, page=${page - 1})}"><i class="bi bi-chevron-left"></i> Newer</a>
        <span th:unless="${page > 0}"></span>
        <span class="small text-body-secondary align-self-center" th:text="'Page ' + ${page + 1}">Page 1</span>
        <a class="btn btn-outline-secondary btn-sm" th:if="${hasNext}"
           th:href="@{/admin/audit(q=${q}, page=${page + 1})}">Older <i class="bi bi-chevron-right"></i></a>
        <span th:unless="${hasNext}"></span>
    </nav>
</div>
</body>
</html>
