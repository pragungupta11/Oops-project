<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('SLA policies')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container mb-5" style="max-width: 900px;">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="page">
        <h2 class="mb-1"><i class="bi bi-stopwatch"></i> SLA policies</h2>
        <p class="text-body-secondary">
            How quickly incidents must be acknowledged (response) and fixed (resolution), per priority.
            Changes apply immediately, also to the deadlines of open incidents, and are saved and audited.
        </p>
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Priority</th><th>Respond within (min)</th><th>Resolve within (min)</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${rows}">
                    <td><strong th:text="${r.priority()}">P1</strong>
                        <span class="text-body-secondary small" th:text="${r.urgency()}">Critical</span></td>
                    <td colspan="3">
                        <form class="row g-2 align-items-center" method="post"
                              th:action="@{/admin/sla/{p}(p=${r.priority()})}">
                            <div class="col">
                                <input type="number" min="1" max="10080" class="form-control" name="responseMinutes"
                                       th:value="${r.responseMinutes()}" required
                                       th:attr="aria-label=${r.priority()} + ' response minutes'">
                            </div>
                            <div class="col">
                                <input type="number" min="1" max="10080" class="form-control" name="resolutionMinutes"
                                       th:value="${r.resolutionMinutes()}" required
                                       th:attr="aria-label=${r.priority()} + ' resolution minutes'">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
                            </div>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
